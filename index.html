    let useRealMap = false;

    function ensureLeaflet(callback) {
        if (window.L) { callback(); return; }
        if (leafletLoading) { setTimeout(() => ensureLeaflet(callback), 200); return; }
        leafletLoading = true;
        const link = document.createElement('link');
        link.rel = 'stylesheet';
        link.href = 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.css';
        document.head.appendChild(link);
        const script = document.createElement('script');
        script.src = 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.js';
        script.onload = () => { leafletLoading = false; callback(); };
        script.onerror = () => {
            leafletLoading = false;
            const box = document.getElementById('realMapBox');
            if (box) box.innerHTML = '<div style="padding:16px;font-size:0.8rem;color:#5f6c6f;">Não consegui carregar o mapa (sem internet?).</div>';
        };
        document.body.appendChild(script);
    }

    function initRealMap(current) {
        const coord = COORDS[current.city];
        const box = document.getElementById('realMapBox');
        if (!box || !coord || !window.L) return;
        if (realMapInstance) { realMapInstance.remove(); realMapInstance = null; }
        const map = L.map(box, { zoomControl: true, attributionControl: true }).setView(coord, 6);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 18,
            attribution: '&copy; OpenStreetMap'
        }).addTo(map);
        L.marker(coord).addTo(map).bindPopup(`${current.city}, ${current.country}`).openPopup();
        realMapInstance = map;
        setTimeout(() => map.invalidateSize(), 150);
    }

    function latLonToXYRegion(lat, lon, region) {
        return {
            x: (lon - region.lonMin) / (region.lonMax - region.lonMin) * region.viewW,
            y: (region.latMax - lat) / (region.latMax - region.latMin) * region.viewH
        };
    }

    // Mapa político de verdade (Europa/Brasil/Angola) com o país atual
    // destacado em dourado e o pino na cidade exata.
    function buildZoomedMapSVG(current) {
        const coord = COORDS[current.city];
        let region = null, regionKey = null;
        for (const [key, r] of Object.entries(REGION_MAPS)) {
            if (r.countries.includes(current.country)) { region = r; regionKey = key; break; }
        }
        if (!region || !coord) return { html: '', regionKey: null };

        const shapesHtml = region.shapes.map(s => {
            const active = s.country === current.country;
            const fill = active ? '#c9a227' : '#b9c6d6';
            const stroke = active ? '#7a5b12' : '#7d8fa3';
            return `<path d="${s.d}" fill="${fill}" stroke="${stroke}" stroke-width="1"/>`;
        }).join('');

        const { x, y } = latLonToXYRegion(coord[0], coord[1], region);
        const pin = `
            <circle cx="${x}" cy="${y}" r="5" fill="none" stroke="#c9a227" stroke-width="2" class="map-pulse"/>
            <path transform="translate(${x},${y - 17})"
                d="M0,0 C-7,0 -12,5 -12,12 C-12,21 0,34 0,34 C0,34 12,21 12,12 C12,5 7,0 0,0 Z"
                fill="#c9a227" stroke="#7a5b12" stroke-width="1"/>
            <circle cx="${x}" cy="${y - 5}" r="4" fill="#fbf9f4"/>
        `;

        const html = `
            <svg viewBox="0 0 ${region.viewW} ${region.viewH}" xmlns="http://www.w3.org/2000/svg">
                <rect width="${region.viewW}" height="${region.viewH}" fill="#dce8ef"/>
                ${shapesHtml}
                ${pin}
            </svg>
        `;
        return { html, regionKey };
    }

    // Monta o bloco do mapa: se o país mudou desde a última vez, mostra a
    // animação globo→zoom; se é o mesmo país de antes, mostra só o mapa já

    function buildMapBlock(current) {
        const zoomed = buildZoomedMapSVG(current);
        if (!zoomed.html) { lastCountryKey = null; return ''; }

            return `

                        <div class="globe-shade"></div>
                    </div>
                    <div class="region-wrap animate-in">
                        ${zoomed.html}

    // ===== Converte data/hora local (num fuso específico) pra instante UTC real =====
    // Funciona certinho mesmo com horário de verão, porque usa o Intl pra
    // descobrir o offset de verdade daquele fuso naquela data exata.
    function zonedTimeToUtc(dateStr, timeStr, timeZone) {
        const [year, month, day] = dateStr.split('-').map(Number);
        const [hour, minute] = timeStr.split(':').map(Number);
        const utcGuess = new Date(Date.UTC(year, month - 1, day, hour, minute, 0));
        const dtf = new Intl.DateTimeFormat('en-US', {
            timeZone, hourCycle: 'h23',
            year: 'numeric', month: '2-digit', day: '2-digit',
            hour: '2-digit', minute: '2-digit', second: '2-digit'
        });
        const parts = dtf.formatToParts(utcGuess);
        const map = {};
        parts.forEach(p => { map[p.type] = p.value; });
        const asUTC = Date.UTC(+map.year, +map.month - 1, +map.day, +map.hour, +map.minute, +map.second);
        const offset = asUTC - utcGuess.getTime();
        return new Date(utcGuess.getTime() - offset);
    }

    // Pré-computa o instante UTC de cada evento
    const EVENTS = RAW_EVENTS.map(([date, time, city, country, title]) => ({
        instant: zonedTimeToUtc(date, time, TZ[country]),
        city, country, title
    })).sort((a, b) => a.instant - b.instant);

    // Pra saber a bandeira do destino quando eles estão voando
    const CITY_TO_COUNTRY = {};
    RAW_EVENTS.forEach(([, , city, country]) => {
        if (!CITY_TO_COUNTRY[city]) CITY_TO_COUNTRY[city] = country;
    });

    const TRIP_START = EVENTS[0].instant;
    const TRIP_END = EVENTS[EVENTS.length - 1].instant;
    const TRIP_TOTAL_DAYS = Math.round((TRIP_END - TRIP_START) / 86400000) + 1;

    function formatLocalTime(instant, timeZone) {
        return new Intl.DateTimeFormat('pt-BR', {
            timeZone, hour: '2-digit', minute: '2-digit', hourCycle: 'h23'
        }).format(instant);
    }
    function formatLocalDate(instant, timeZone) {
        return new Intl.DateTimeFormat('pt-BR', {
            timeZone, day: '2-digit', month: '2-digit'
        }).format(instant);
    }

    // ===== Diferença de fuso horário em relação ao Brasil (Brasília) =====
    // Pra mãe não precisar fazer conta: "3h a mais que aqui".
    function getUtcOffsetMinutes(instant, timeZone) {
        const parts = new Intl.DateTimeFormat('en-US', {
            timeZone, timeZoneName: 'shortOffset'
        }).formatToParts(instant);
        const tzName = parts.find(p => p.type === 'timeZoneName').value; // ex: "GMT+1"
        const match = tzName.match(/GMT([+-]\d+)(?::(\d+))?/);
        if (!match) return 0;
        const h = parseInt(match[1], 10);
        const m = match[2] ? parseInt(match[2], 10) : 0;
        return h * 60 + (h < 0 ? -m : m);
    }
    function timeDiffLabel(instant, timeZone) {
        const diffMin = getUtcOffsetMinutes(instant, timeZone) - getUtcOffsetMinutes(instant, 'America/Sao_Paulo');
        if (diffMin === 0) return '🕐 Mesmo horário que o Brasil';
        const diffH = Math.abs(diffMin) / 60;
        const hTxt = diffH % 1 === 0 ? `${diffH}h` : `${diffH.toFixed(1)}h`;
        return diffMin > 0
            ? `🕐 ${hTxt} a mais que o horário de Brasília`
            : `🕐 ${hTxt} a menos que o horário de Brasília`;
    }

    // Modo de teste: abrir com ?demo=2026-10-11T19:00:00 na URL simula
    // aquela data/hora NO HORÁRIO DE BRASÍLIA, só pra pré-visualizar como
    // a página fica durante a viagem. Sem o parâmetro, usa a hora real.
    function getNow() {
        const params = new URLSearchParams(window.location.search);
        const demo = params.get('demo');
        if (demo) {
            const [datePart, timePart] = demo.split('T');
            if (datePart && timePart) {
                const parsed = zonedTimeToUtc(datePart, timePart.slice(0, 5), 'America/Sao_Paulo');
                if (!isNaN(parsed)) return parsed;
            }
        }
        return new Date();
    }

    function render() {
        const now = getNow();
        const content = document.getElementById('content');
        const first = EVENTS[0];
        const last = EVENTS[EVENTS.length - 1];

        if (now < first.instant) {
            lastCountryKey = null;
            const diffMs = first.instant - now;
            const days = Math.floor(diffMs / (1000 * 60 * 60 * 24));
            const hours = Math.floor((diffMs / (1000 * 60 * 60)) % 24);
            content.innerHTML = `
                <div class="status-banner">
                    🧳 A viagem ainda não começou!<br>
                    Faltam ${days}d ${hours}h pro embarque.
                </div>
            `;
            return;
        }

        if (now > last.instant) {
            lastCountryKey = null;
            content.innerHTML = `
                <div class="status-banner">
                    🏠 Victor e Maicon já voltaram pra casa!<br>
                    A viagem terminou dia 30/10.
                </div>
            `;
            return;
        }

        // Encontra o último evento cujo horário já passou = atividade atual
        let current = EVENTS[0];
        for (const ev of EVENTS) {
            if (ev.instant <= now) current = ev; else break;
        }

        // "Dia X de Y" da viagem, pra ela acompanhar o progresso
        const dayNum = Math.min(TRIP_TOTAL_DAYS, Math.max(1, Math.floor((now - TRIP_START) / 86400000) + 1));
        const dayBadge = `<div class="trip-day">Dia ${dayNum} de ${TRIP_TOTAL_DAYS} da viagem</div>`;

        // ===== Estão viajando agora (voo, trem ou ônibus entre cidades)? =====
        // Mostra um aviso especial em vez do roteiro, já que não faz sentido
        // dizer que "estão" numa cidade quando estão a caminho de outra.
        const TRANSPORT_INFO = {
            'Voo': { icon: '✈️', verbo: 'voando' },
            'Trem': { icon: '🚆', verbo: 'no trem' },
            'Ônibus': { icon: '🚌', verbo: 'no ônibus' }
        };
        const transportMatch = current.title.match(/^(Voo|Trem|Ônibus):\s*(.+?)\s*→\s*(.+?)\s*\(partida\)/);
        if (transportMatch) {
            const tipo = transportMatch[1];
            const origem = transportMatch[2];
            const destino = transportMatch[3];
            const destinoPais = CITY_TO_COUNTRY[destino];
            const flagOrigem = FLAG[current.country] || '🌍';
            const flagDestino = FLAG[destinoPais] || '🌍';
            const info = TRANSPORT_INFO[tipo];

            // Próximo evento = chegada, pra dar uma previsão de horário
            const idx = EVENTS.indexOf(current);
            const next = EVENTS[idx + 1];
            let eta = '';
            if (next) {
                const etaTz = TZ[next.country];
                eta = `<div class="flight-eta">Chegada prevista: ${formatLocalTime(next.instant, etaTz)} (horário de ${next.city})</div>`;
            }

            lastCountryKey = null;
            content.innerHTML = `
                ${dayBadge}
                <div class="flight-banner">
                    ${info.icon}
                    <div class="flight-route">${flagOrigem} ${origem} → ${destino} ${flagDestino}</div>
                    Estão ${info.verbo} agora!
                    ${eta}
                </div>
            `;
            return;
        }

        const tz = TZ[current.country];
        const localTime = formatLocalTime(now, tz);
        const localDate = formatLocalDate(now, tz);
        const flag = FLAG[current.country] || '🌍';
        const timeDiff = timeDiffLabel(now, tz);

        // Das 22h às 08h no horário local do país onde estão, consideramos
        // que estão dormindo (não importa o que a última atividade do
        // roteiro tenha sido) — não faz sentido mostrar um passeio antigo.
        const localHour = parseInt(localTime.split(':')[0], 10);
        const isSleeping = localHour >= 22 || localHour < 8;
        const isConnection = /^Conexão em/.test(current.title);

        // Já acordaram (passou das 8h), mas o passeio de hoje só começa mais
        // tarde (ex: primeiro evento do dia é 10h) — nesses casos NÃO faz
        // sentido continuar mostrando o "Jantar" ou último passeio de ontem
        // à noite. Comparamos a data do evento atual com a data de hoje.
        const currentEventDate = formatLocalDate(current.instant, tz);
        const idxNow = EVENTS.indexOf(current);
        const nextEvent = EVENTS[idxNow + 1];
        const isStaleFromYesterday = !isSleeping && currentEventDate !== localDate;

        let activityLabel = 'Agora eles estão em...';
        let activityText = current.title;
        let activityClass = 'activity';
        if (isSleeping) {
            activityLabel = 'Agora eles estão...';
            activityText = '😴 Dormindo';
        } else if (isConnection) {
            activityLabel = 'Agora eles estão...';
            activityText = '🔄 ' + current.title;
            activityClass = 'activity transit';
        } else if (isStaleFromYesterday) {
            activityLabel = 'Agora eles estão...';
            activityText = '☀️ Começando o dia';
            activityClass = 'activity transit';
            if (nextEvent) {
                const nextTz = TZ[nextEvent.country];
                activityText += `<br><span style="font-size:0.85rem;font-weight:normal;">Próximo: ${nextEvent.title} às ${formatLocalTime(nextEvent.instant, nextTz)}</span>`;
            }
        }

        const hasMapData = !!COORDS[current.city];
        let mapSection = '';
        if (hasMapData && useRealMap) {
            mapSection = `
                <div id="realMapBox"></div>
                <div class="real-map-note">🌐 Mapa real (OpenStreetMap) — precisa de internet</div>
                <button class="map-toggle" id="mapToggleBtn">🎨 Ver globo estilizado (offline)</button>
            `;
        } else if (hasMapData) {
            mapSection = `
                ${buildMapBlock(current)}
                <button class="map-toggle" id="mapToggleBtn">🌐 Ver mapa real (precisa internet)</button>
            `;
        }

        content.innerHTML = `
            ${dayBadge}
            ${mapSection}
            <div class="flag">${flag}</div>
            <div class="city">${current.city}</div>
            <div class="country">${current.country} — ${localDate}</div>
            <div class="time-block">
                <div class="time-label">Hora local</div>
                <div class="time-value">${localTime}</div>
            </div>
            <div class="time-diff">${timeDiff}</div>
            <div class="activity-label">${activityLabel}</div>
            <div class="${activityClass}">${activityText}</div>
        `;

        if (hasMapData && useRealMap) {
            ensureLeaflet(() => initRealMap(current));
        }

        const toggleBtn = document.getElementById('mapToggleBtn');
        if (toggleBtn) toggleBtn.addEventListener('click', toggleMapMode);
    }

    const refreshBtn = document.getElementById('refreshBtn');
    if (refreshBtn) refreshBtn.addEventListener('click', render);

    render();
    setInterval(render, 60 * 1000);
</script>
</body>
</html>
